services:
  adguard_home_backup:
    image: offen/docker-volume-backup:v2.48.0
    container_name: adguard_home_volume_backup
    restart: unless-stopped
    env_file:
      - backup.env
    environment:
      BACKUP_FILENAME: adguard-home-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: adguard-home-backup-
    volumes:
      - ${ADGUARD_HOME_STACK_HOST_PATH}:/backup/adguard_home_stack:ro
      - ${BACKUP_ROOT:-/mnt/default_pool/dockge/back}/adguard-home:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro

