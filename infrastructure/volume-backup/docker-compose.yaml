services:
  unhealthy_container_restart:
    image: docker:27-cli
    container_name: unhealthy_container_restart
    restart: unless-stopped
    environment:
      UNHEALTHY_RESTART_INTERVAL_SECONDS: ${UNHEALTHY_RESTART_INTERVAL_SECONDS:-60}
    command: >
      sh -c 'while :; do
        /usr/local/bin/restart-unhealthy-containers.sh --backup-labeled;
        sleep "$${UNHEALTHY_RESTART_INTERVAL_SECONDS}";
      done'
    volumes:
      - ./restart-unhealthy-containers.sh:/usr/local/bin/restart-unhealthy-containers.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock

  adguard_home_backup:
    image: offen/docker-volume-backup:v2.48.0
    container_name: adguard_home_volume_backup
    restart: unless-stopped
    env_file:
      - backup.env
    environment:
      BACKUP_FILENAME: adguard-home-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: adguard-home-backup-
      BACKUP_STOP_DURING_BACKUP_LABEL: adguard-home
    volumes:
      - ${ADGUARD_HOME_STACK_HOST_PATH}:/backup/adguard_home_stack:ro
      - ${BACKUP_ROOT:-/mnt/default_pool/dockge/back}/adguard-home:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro

