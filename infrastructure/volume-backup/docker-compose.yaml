services:
  firefly_iii_backup:
    image: offen/docker-volume-backup:v2.48.0
    container_name: firefly_iii_volume_backup
    restart: unless-stopped
    env_file:
      - backup.env
    environment:
      BACKUP_FILENAME: firefly-iii-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: firefly-iii-backup-
    volumes:
      - ../../eggenberg-services/firefly-iii/firefly-iii/db:/backup/firefly_iii_db:ro
      - ../../eggenberg-services/firefly-iii/firefly-iii/upload:/backup/firefly_iii_upload:ro
      - ${BACKUP_ROOT:-/mnt/default_pool/dockge/back}/firefly-iii:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro

