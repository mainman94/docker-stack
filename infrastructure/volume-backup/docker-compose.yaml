services:
  firefly_iii_backup:
    image: offen/docker-volume-backup:v2.48.0
    container_name: firefly_iii_volume_backup
    restart: unless-stopped
    env_file:
      - backup.env
    environment:
      BACKUP_FILENAME: firefly-iii-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: firefly-iii-backup-
    volumes:
      - firefly_iii_db:/backup/firefly_iii_db:ro
      - firefly_iii_upload:/backup/firefly_iii_upload:ro
      - ${BACKUP_ROOT:-/mnt/default_pool/dockge/back}/firefly-iii:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro

  bambuddy_backup:
    image: offen/docker-volume-backup:v2.48.0
    container_name: bambuddy_volume_backup
    restart: unless-stopped
    env_file:
      - backup.env
    environment:
      BACKUP_FILENAME: bambuddy-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: bambuddy-backup-
    volumes:
      - bambuddy_data:/backup/bambuddy_data:ro
      - bambuddy_logs:/backup/bambuddy_logs:ro
      - ../../eggenberg-services/bambuddy/virtual_printer:/backup/bambuddy_virtual_printer:ro
      - ${BACKUP_ROOT:-/mnt/default_pool/dockge/back}/bambuddy:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro

  jellyfin_backup:
    image: offen/docker-volume-backup:v2.48.0
    container_name: jellyfin_volume_backup
    restart: unless-stopped
    env_file:
      - backup.env
    environment:
      BACKUP_FILENAME: jellyfin-backup-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: jellyfin-backup-
    volumes:
      - ../../eggenberg-services/jellyfin/jellyfin/config:/backup/jellyfin_config:ro
      - ../../eggenberg-services/jellyfin/jellyfin/cache:/backup/jellyfin_cache:ro
      - ${BACKUP_ROOT:-/mnt/default_pool/dockge/back}/jellyfin:/archive
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  firefly_iii_db:
    external: true
    name: ${FIREFLY_DB_VOLUME:-firefly-iii_firefly_iii_db}
  firefly_iii_upload:
    external: true
    name: ${FIREFLY_UPLOAD_VOLUME:-firefly-iii_firefly_iii_upload}
  bambuddy_data:
    external: true
    name: ${BAMBUDDY_DATA_VOLUME:-bambuddy_bambuddy_data}
  bambuddy_logs:
    external: true
    name: ${BAMBUDDY_LOGS_VOLUME:-bambuddy_bambuddy_logs}
