services:
  paperless-redis:
    image: valkey/valkey:9.1-alpine@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
    container_name: paperless-redis
    user: "${PAPERLESS_REDIS_UID}:${PAPERLESS_REDIS_GID}"
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=paperless
    command: >
      valkey-server
      --save 60 1
      --loglevel warning
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - ${PAPERLESS_REDIS_DATA_HOST_PATH}:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: ${PAPERLESS_REDIS_CPUS}
    mem_limit: ${PAPERLESS_REDIS_MEM_LIMIT}

  paperless-db:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: paperless-db
    restart: unless-stopped
    stop_grace_period: 60s
    labels:
      - docker-volume-backup.stop-during-backup=paperless
    environment:
      POSTGRES_DB: ${PAPERLESS_POSTGRES_DATABASE}
      POSTGRES_USER: ${PAPERLESS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PAPERLESS_POSTGRES_PASSWORD}
      TZ: ${PAPERLESS_TZ}
    volumes:
      # PG18 stores its cluster in $PGDATA=/var/lib/postgresql/18/docker and
      # declares VOLUME /var/lib/postgresql. Mount the parent, as upstream
      # recommends: the cluster then lives in <postgres-data>/18/docker, where
      # it already is, and pg_upgrade --link works without crossing a mount
      # boundary. Do not pin PGDATA at /var/lib/postgresql/data — the mount
      # there is unused, and 18's entrypoint aborts on it.
      - ${PAPERLESS_POSTGRES_DATA_HOST_PATH}:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: ${PAPERLESS_POSTGRES_CPUS}
    mem_limit: ${PAPERLESS_POSTGRES_MEM_LIMIT}

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.1.0@sha256:49eba766581b9134cfa6b584b9eb718355fb9cfbd44b2a7c9c72a427d4891648
    container_name: paperless
    user: "${PAPERLESS_USERMAP_UID}:${PAPERLESS_USERMAP_GID}"
    restart: unless-stopped
    depends_on:
      paperless-db:
        condition: service_healthy
      paperless-redis:
        condition: service_healthy
      paperless-gotenberg:
        condition: service_healthy
      paperless-tika:
        condition: service_healthy
    labels:
      - docker-volume-backup.stop-during-backup=paperless
    environment:
      TZ: ${PAPERLESS_TZ}
      USERMAP_UID: ${PAPERLESS_USERMAP_UID}
      USERMAP_GID: ${PAPERLESS_USERMAP_GID}

      PAPERLESS_URL: ${PAPERLESS_URL}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}

      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_ADMIN_MAIL: ${PAPERLESS_ADMIN_MAIL}

      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: ${PAPERLESS_POSTGRES_DATABASE}
      PAPERLESS_DBUSER: ${PAPERLESS_POSTGRES_USER}
      PAPERLESS_DBPASS: ${PAPERLESS_POSTGRES_PASSWORD}

      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE}
      PAPERLESS_OCR_PAGES: ${PAPERLESS_OCR_PAGES:-5}

      PAPERLESS_TIKA_ENABLED: ${PAPERLESS_TIKA_ENABLED}
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000

      # Low RAM tuning for single-user homelab
      PAPERLESS_TASK_WORKERS: 1
      PAPERLESS_THREADS_PER_WORKER: 1
      PAPERLESS_WEBSERVER_WORKERS: 1
      PAPERLESS_ENABLE_DOCUMENT_MATCHING: false
      PAPERLESS_CONSUMER_ENABLE_BARCODES: false
    volumes:
      - ${PAPERLESS_DATA_HOST_PATH}:/usr/src/paperless/data
      - ${PAPERLESS_MEDIA_HOST_PATH}:/usr/src/paperless/media
      - ${PAPERLESS_EXPORT_HOST_PATH}:/usr/src/paperless/export
      - ${PAPERLESS_TRASH_HOST_PATH}:/usr/src/paperless/trash
      - ${PAPERLESS_CONSUME_HOST_PATH}:/usr/src/paperless/consume
      - ${PAPERLESS_BACKUP_HOST_PATH}:/backup
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${PAPERLESS_WEB_PORT}:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    cpus: ${PAPERLESS_CPUS}
    mem_limit: ${PAPERLESS_MEM_LIMIT}

  paperless-gotenberg:
    image: gotenberg/gotenberg:8.36.0@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
    container_name: paperless-gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-routes=true
    healthcheck:
      test: curl -sf http://localhost:3000/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${PAPERLESS_GOTENBERG_CPUS}
    mem_limit: ${PAPERLESS_GOTENBERG_MEM_LIMIT}

  paperless-tika:
    image: apache/tika:3.3.1.0@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
    container_name: paperless-tika
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9998'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${PAPERLESS_TIKA_CPUS}
    mem_limit: ${PAPERLESS_TIKA_MEM_LIMIT}

networks:
  default:
    name: paperless_network
