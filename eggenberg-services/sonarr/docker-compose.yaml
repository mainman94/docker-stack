services:
  sonarr:
    image: linuxserver/sonarr:4.0.20.3014-ls328@sha256:0deb8db6c839ac475e9cd86277712772c40ba7f929a003d7e1de36c4b666bc13
    container_name: sonarr
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=sonarr
    environment:
      PUID: ${SONARR_UID}
      PGID: ${SONARR_GID}
      TZ: ${SONARR_TZ}
    ports:
      - "${SONARR_WEB_PORT}:8989"
    volumes:
      - ${SONARR_CONFIG_HOST_PATH}:${SONARR_CONFIG_CONTAINER_PATH}
      - ${SONARR_SERIES_HOST_PATH}:${SONARR_SERIES_CONTAINER_PATH}
      - ${SONARR_DOWNLOADS_HOST_PATH}:${SONARR_DOWNLOADS_CONTAINER_PATH}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8989/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${SONARR_CPUS}
    mem_limit: ${SONARR_MEM_LIMIT}

networks:
  default:
    name: sonarr_network
