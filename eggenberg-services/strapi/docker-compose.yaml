services:
  db:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: strapi_db
    restart: unless-stopped
    stop_grace_period: 60s
    labels:
      - docker-volume-backup.stop-during-backup=strapi
    environment:
      POSTGRES_DB: ${STRAPI_DATABASE:-strapi}
      POSTGRES_USER: ${STRAPI_DB_USER:-strapi}
      POSTGRES_PASSWORD: ${STRAPI_DB_PASSWORD:-change_me}
      TZ: ${STRAPI_TZ:-Europe/Vienna}
    volumes:
      - ${STRAPI_DB_HOST_PATH:-./strapi/db}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: ${STRAPI_DB_CPUS:-1.0}
    mem_limit: ${STRAPI_DB_MEM_LIMIT:-1024m}

  app:
    image: vshadbolt/strapi:5.50.2-alpine@sha256:04450cd60883838e45bd47c1a3278ffe9dffede1dcbd1c6ccccf0975a889f3a8
    container_name: strapi_app
    init: true
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=strapi
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_CLIENT: ${STRAPI_DATABASE_CLIENT:-postgres}
      DATABASE_HOST: ${STRAPI_DATABASE_HOST:-db}
      DATABASE_PORT: ${STRAPI_DATABASE_PORT:-5432}
      DATABASE_NAME: ${STRAPI_DATABASE:-strapi}
      DATABASE_USERNAME: ${STRAPI_DB_USER:-strapi}
      DATABASE_PASSWORD: ${STRAPI_DB_PASSWORD:-change_me}
      DATABASE_SSL: ${STRAPI_DATABASE_SSL:-false}
      NODE_ENV: ${STRAPI_NODE_ENV:-production}
      HOST: ${STRAPI_HOST:-0.0.0.0}
      PORT: ${STRAPI_PORT:-1337}
      PUBLIC_URL: ${STRAPI_PUBLIC_URL:-http://localhost:30668}
      ADMIN_URL: ${STRAPI_ADMIN_URL:-http://localhost:30668/admin}
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      TZ: ${STRAPI_TZ:-Europe/Vienna}
    volumes:
      - ${STRAPI_APP_HOST_PATH:-./strapi/app}:/srv/app
    ports:
      - "${STRAPI_WEB_PORT:-30668}:${STRAPI_PORT:-1337}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:1337/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    cpus: ${STRAPI_CPUS:-1.0}
    mem_limit: ${STRAPI_MEM_LIMIT:-1024m}

networks:
  default:
    name: strapi_network
