services:
  dockhand:
    image: fnsys/dockhand:v1.0.51@sha256:ffba7083c8d28ae7afdc3c30e89ee03d43fa6ee99c335ee25e8cfab8b767f431
    container_name: dockhand
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=dockhand
    # Start non-root. With PUID/PGID the entrypoint starts as root and runs
    # `chown -R` over DATA_DIR/stacks on every start, flipping every stack's
    # postgres-data (uid 70) to 568 under the running db containers.
    user: "${DOCKHAND_UID}:${DOCKHAND_GID}"
    environment:
      TZ: ${DOCKHAND_TZ}
      # Dockhand shells out to `docker compose` with cwd inside DATA_DIR, but
      # the daemon resolving the relative bind mounts runs on the host. So the
      # data dir must be mounted at the identical path inside the container,
      # otherwise every managed stack tries to bind /app/data/... on the host.
      DATA_DIR: ${DOCKHAND_DATA_HOST_PATH}
      HOST_DATA_DIR: ${DOCKHAND_DATA_HOST_PATH}
    volumes:
      - ${DOCKHAND_DATA_HOST_PATH}:${DOCKHAND_DATA_HOST_PATH}
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    # PGID 568 does not own the docker socket; join the socket's group instead.
    # Host GID: stat -c '%g' /var/run/docker.sock
    group_add:
      - ${DOCKHAND_DOCKER_GID}
    ports:
      - "${DOCKHAND_WEB_PORT}:3000"
    cpus: ${DOCKHAND_CPUS}
    mem_limit: ${DOCKHAND_MEM_LIMIT}

networks:
  default:
    name: dockhand_network
