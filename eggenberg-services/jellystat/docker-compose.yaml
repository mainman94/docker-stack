services:
  jellystat-db:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    shm_size: ${JELLYSTAT_SHM_SIZE:-1gb}
    container_name: jellystat-db
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "${JELLYSTAT_LOG_MAX_FILE}"
        max-size: "${JELLYSTAT_LOG_MAX_SIZE}"
    labels:
      - docker-volume-backup.stop-during-backup=jellystat
    environment:
      POSTGRES_USER: ${JELLYSTAT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JELLYSTAT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${JELLYSTAT_POSTGRES_DATABASE}
      TZ: ${JELLYSTAT_TZ}
    volumes:
      # PG18 stores its cluster in $PGDATA=/var/lib/postgresql/18/docker and
      # declares VOLUME /var/lib/postgresql. Mount the parent, as upstream
      # recommends: the cluster then lives in <postgres-data>/18/docker, where
      # it already is, and pg_upgrade --link works without crossing a mount
      # boundary. Do not pin PGDATA at /var/lib/postgresql/data — the mount
      # there is unused, and 18's entrypoint aborts on it.
      - ${JELLYSTAT_POSTGRES_DATA_HOST_PATH}:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --dbname=${JELLYSTAT_POSTGRES_DATABASE} --username=${JELLYSTAT_POSTGRES_USER}
      interval: 10s
      timeout: 5s
      retries: 5

  jellystat:
    image: cyfershepard/jellystat:1.1.11
    container_name: jellystat
    user: "${JELLYSTAT_UID}:${JELLYSTAT_GID}"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "${JELLYSTAT_LOG_MAX_FILE}"
        max-size: "${JELLYSTAT_LOG_MAX_SIZE}"
    depends_on:
      jellystat-db:
        condition: service_healthy
    labels:
      - docker-volume-backup.stop-during-backup=jellystat
    environment:
      POSTGRES_USER: ${JELLYSTAT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${JELLYSTAT_POSTGRES_PASSWORD}
      POSTGRES_IP: jellystat-db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${JELLYSTAT_POSTGRES_DATABASE}
      JWT_SECRET: ${JELLYSTAT_JWT_SECRET}
      TZ: ${JELLYSTAT_TZ}
      IS_EMBY_API: ${JELLYSTAT_IS_EMBY_API}
    volumes:
      - type: bind
        source: ${JELLYSTAT_BACKUP_HOST_PATH}
        target: ${JELLYSTAT_BACKUP_CONTAINER_PATH}
    ports:
      - "${JELLYSTAT_WEB_PORT}:3000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/auth/isConfigured || exit 1
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 30s
    cpus: ${JELLYSTAT_CPUS}
    mem_limit: ${JELLYSTAT_MEM_LIMIT}

networks:
  default:
    name: jellystat_network
