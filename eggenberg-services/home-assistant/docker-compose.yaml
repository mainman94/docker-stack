services:
  # One-shot: install HACS into the (persistent) config volume if missing.
  # Idempotent — exits fast when custom_components/hacs already exists.
  hacs-install:
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    container_name: hacs-install
    restart: "no"
    volumes:
      - ${HOME_ASSISTANT_CONFIG_HOST_PATH}:${HOME_ASSISTANT_CONFIG_CONTAINER_PATH}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        cd ${HOME_ASSISTANT_CONFIG_CONTAINER_PATH}
        if [ -d custom_components/hacs ]; then echo "HACS present, skip"; exit 0; fi
        apk add --no-cache wget unzip >/dev/null
        mkdir -p custom_components/hacs
        wget -qO /tmp/hacs.zip https://github.com/hacs/integration/releases/latest/download/hacs.zip
        unzip -oq /tmp/hacs.zip -d custom_components/hacs
        echo "HACS installed"

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2026.9.3@sha256:d8922685169707fd91e8b9729902d975f06157d005e422874d201e0261dda196
    container_name: home-assistant
    # must run as root: HA installs custom-integration Python requirements into
    # /usr/local/lib/python3.x/site-packages at runtime, which fails as non-root
    restart: unless-stopped
    depends_on:
      hacs-install:
        condition: service_completed_successfully
    labels:
      - docker-volume-backup.stop-during-backup=home-assistant
    environment:
      TZ: ${HOME_ASSISTANT_TZ}
    ports:
      - "${HOME_ASSISTANT_WEB_PORT}:8123"
    volumes:
      - ${HOME_ASSISTANT_CONFIG_HOST_PATH}:${HOME_ASSISTANT_CONFIG_CONTAINER_PATH}
    healthcheck:
      test: curl -sf http://localhost:8123/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    cpus: ${HOME_ASSISTANT_CPUS}
    mem_limit: ${HOME_ASSISTANT_MEM_LIMIT}

  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:8.1.0@sha256:170aa093ce91c76cde4cc390918307590f0f5558fcec93f913af3cb019e6562a
    container_name: matter-server
    restart: unless-stopped
    # host network required: Matter/Thread commissioning needs mDNS + IPv6 link-local
    network_mode: host
    security_opt:
      - apparmor=unconfined
    labels:
      - docker-volume-backup.stop-during-backup=home-assistant
    environment:
      TZ: ${HOME_ASSISTANT_TZ}
    volumes:
      - ${MATTER_SERVER_DATA_HOST_PATH}:/data
      - /run/dbus:/run/dbus:ro
    healthcheck:
      test: python -c "import socket; socket.create_connection(('localhost', 5580), 3)" || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${MATTER_SERVER_CPUS}
    mem_limit: ${MATTER_SERVER_MEM_LIMIT}

networks:
  default:
    name: home_assistant_network
