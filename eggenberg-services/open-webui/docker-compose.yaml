# Open WebUI + LiteLLM. No local inference, no Ollama, no GPU.
# Models come from external providers through LiteLLM, embeddings via an API.
#
# ponytail: own LiteLLM instead of the openclaw router. That one is
# Anthropic-only and has no DB. Merge them once both stacks want the same
# models and the same key management — then as an external network.

services:

  # -------------------------------------------------------------------------
  # Postgres with pgvector — serves Open WebUI (chats, users, RAG, memories)
  # and LiteLLM (keys, spend).
  # Two separate databases in one cluster, created by init-db.sql.
  # A Postgres major upgrade is its own procedure, not just a tag bump.
  #
  # PG18 moved its default data directory to /var/lib/postgresql/18/docker.
  # Do NOT bind-mount /var/lib/postgresql to follow that: the entrypoint's root
  # pass creates 18/docker but chowns only the leaf, then re-execs itself as
  # the postgres user, which then cannot write the parent it does not own:
  #   mkdir: cannot create directory '/var/lib/postgresql/18': Permission denied
  # Pinning PGDATA to the pre-18 path keeps the layout the other stacks use.
  # -------------------------------------------------------------------------
  open-webui-db:
    image: pgvector/pgvector:0.8.6-pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    container_name: open-webui-db
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=open-webui
    environment:
      POSTGRES_USER: ${OPEN_WEBUI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${OPEN_WEBUI_POSTGRES_PASSWORD}
      POSTGRES_DB: openwebui
      PGDATA: /var/lib/postgresql/data
      TZ: ${OPEN_WEBUI_TZ}
    volumes:
      - ${OPEN_WEBUI_POSTGRES_DATA_HOST_PATH}:/var/lib/postgresql/data
      # Runs only on the very first start, while the data dir is still empty.
      - ./config/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    cpus: ${OPEN_WEBUI_POSTGRES_CPUS}
    mem_limit: ${OPEN_WEBUI_POSTGRES_MEM_LIMIT}

  # -------------------------------------------------------------------------
  # Redis — websockets and cache for Open WebUI, router cache for LiteLLM
  # -------------------------------------------------------------------------
  open-webui-redis:
    image: valkey/valkey:9.1-alpine@sha256:de31910896150d5e754a07d57d227cfdde4e258ddd0d1aa4607f2d2f95843715
    container_name: open-webui-redis
    user: "${OPEN_WEBUI_REDIS_UID}:${OPEN_WEBUI_REDIS_GID}"
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=open-webui
    command: >
      valkey-server
      --save 60 1
      --appendonly no
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - ${OPEN_WEBUI_REDIS_DATA_HOST_PATH}:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    cpus: ${OPEN_WEBUI_REDIS_CPUS}
    mem_limit: ${OPEN_WEBUI_REDIS_MEM_LIMIT}

  # -------------------------------------------------------------------------
  # LiteLLM — model-agnostic proxy. Internal only; Open WebUI reaches it over
  # the stack network.
  # -------------------------------------------------------------------------
  open-webui-litellm:
    image: ghcr.io/berriai/litellm-database:v1.83.14-stable@sha256:da4ab06d9d57da205263877425544d6df8e78147737b0dd8dc1e9e93a6d8ac2e
    container_name: open-webui-litellm
    restart: unless-stopped
    depends_on:
      open-webui-db:
        condition: service_healthy
      open-webui-redis:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      TZ: ${OPEN_WEBUI_TZ}
      DATABASE_URL: postgresql://${OPEN_WEBUI_POSTGRES_USER}:${OPEN_WEBUI_POSTGRES_PASSWORD}@open-webui-db:5432/litellm
      LITELLM_MASTER_KEY: ${OPEN_WEBUI_LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${OPEN_WEBUI_LITELLM_SALT_KEY}
      REDIS_HOST: open-webui-redis
      REDIS_PORT: "6379"
      # Provider keys — only fill in what is actually used.
      ANTHROPIC_API_KEY: ${OPEN_WEBUI_ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPEN_WEBUI_OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPEN_WEBUI_OPENROUTER_API_KEY}
      GROQ_API_KEY: ${OPEN_WEBUI_GROQ_API_KEY}
      GEMINI_API_KEY: ${OPEN_WEBUI_GEMINI_API_KEY}
    volumes:
      - ./config/litellm-config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    cpus: ${OPEN_WEBUI_LITELLM_CPUS}
    mem_limit: ${OPEN_WEBUI_LITELLM_MEM_LIMIT}

  # -------------------------------------------------------------------------
  # Open WebUI
  # 0.11.0 ships database schema changes: back up Postgres before any upgrade.
  # -------------------------------------------------------------------------
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.1@sha256:6bb1fbe8ab0a3e0456067f493044ffb66a30a65a34be47f6a5862176a370dd16
    container_name: open-webui
    # No user override: the image writes branding assets into its own
    # /app/backend/open_webui/static, which root owns inside the image. As 568
    # every start floods the log with
    #   ERROR [root] An error occurred: [Errno 13] Permission denied:
    #   '/app/backend/open_webui/static/favicon.ico'
    # Only /app/backend/data is bind-mounted, and root writes it fine.
    restart: unless-stopped
    depends_on:
      open-webui-db:
        condition: service_healthy
      open-webui-redis:
        condition: service_healthy
      open-webui-litellm:
        condition: service_healthy
    labels:
      - docker-volume-backup.stop-during-backup=open-webui
    environment:
      TZ: ${OPEN_WEBUI_TZ}
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY}
      WEBUI_URL: ${OPEN_WEBUI_URL}

      # --- Database (psycopg v3, since OWUI 0.9.2) ---
      DATABASE_URL: postgresql://${OPEN_WEBUI_POSTGRES_USER}:${OPEN_WEBUI_POSTGRES_PASSWORD}@open-webui-db:5432/openwebui
      VECTOR_DB: pgvector
      PGVECTOR_DB_URL: postgresql://${OPEN_WEBUI_POSTGRES_USER}:${OPEN_WEBUI_POSTGRES_PASSWORD}@open-webui-db:5432/openwebui

      # --- Redis: websockets, multi-worker ---
      REDIS_URL: redis://open-webui-redis:6379/0
      ENABLE_WEBSOCKET_SUPPORT: "true"
      WEBSOCKET_MANAGER: redis
      WEBSOCKET_REDIS_URL: redis://open-webui-redis:6379/1

      # --- Ollama off, models arrive through LiteLLM ---
      # These two seed the connection on the FIRST start only. Open WebUI then
      # owns them in its database and ignores the environment, so editing them
      # here changes nothing on a running install — fix the entry under
      # Admin Panel -> Connections instead. Set ENABLE_PERSISTENT_CONFIG=false
      # if you would rather have the environment win on every start.
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: http://open-webui-litellm:4000/v1
      OPENAI_API_KEY: ${OPEN_WEBUI_LITELLM_MASTER_KEY}

      # --- Embeddings via API instead of local sentence-transformers ---
      # Without this Open WebUI loads a model into the container and runs it
      # on the CPU — the first bottleneck on this box.
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: ${OPEN_WEBUI_RAG_EMBEDDING_MODEL}
      RAG_OPENAI_API_BASE_URL: ${OPEN_WEBUI_RAG_EMBEDDING_BASE_URL}
      RAG_OPENAI_API_KEY: ${OPEN_WEBUI_RAG_EMBEDDING_API_KEY}

      # --- Built-in memory ---
      # Open WebUI's own memory: visible and editable under Settings ->
      # Personalization, stored in its Postgres. Weaker extraction than a
      # dedicated memory service, but no extra service to keep alive.
      ENABLE_MEMORIES: "true"

      # First registered user becomes admin; set to "false" afterwards.
      ENABLE_SIGNUP: ${OPEN_WEBUI_ENABLE_SIGNUP}
    volumes:
      - ${OPEN_WEBUI_DATA_HOST_PATH}:/app/backend/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${OPEN_WEBUI_WEB_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    cpus: ${OPEN_WEBUI_CPUS}
    mem_limit: ${OPEN_WEBUI_MEM_LIMIT}

  # -------------------------------------------------------------------------
  # Open Terminal — sandbox the model can run commands in (code interpreter).
  #
  # This container executes what the model tells it to. A prompt injected via
  # an uploaded document or a fetched web page reaches this shell, so treat it
  # as hosting untrusted code, not as a normal service:
  #   - never mount /var/run/docker.sock here (root on the host, and this host
  #     also runs vaultwarden, openbao and gitea)
  #   - never run the bare-metal/pip install variant on the NAS
  #   - no host paths beyond its own home directory
  # Egress to the LAN is deliberately left open — the owner asked for it, so
  # the blast radius includes anything the NAS can reach. Put it on an
  # `internal: true` network to take that away.
  #
  # ponytail: the full image (~4GB). Upstream ships smaller slim/alpine
  # variants, but only as floating tags — no versioned slim/alpine exists, and
  # this repo pins everything. Switch if disk matters more than pinning.
  # -------------------------------------------------------------------------
  open-webui-terminal:
    image: ghcr.io/open-webui/open-terminal:0.12.3@sha256:8f6d2045aa69e348e39d89bf59e6b267773532335333eed14ff16bbc7c964b73
    container_name: open-webui-terminal
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=open-webui
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${OPEN_WEBUI_TZ}
      # Without this one is generated at startup and changes on every restart,
      # which silently breaks the connection configured in Open WebUI.
      OPEN_TERMINAL_API_KEY: ${OPEN_WEBUI_TERMINAL_API_KEY}
    volumes:
      - ${OPEN_WEBUI_TERMINAL_HOME_HOST_PATH}:/home/user
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8000'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    cpus: ${OPEN_WEBUI_TERMINAL_CPUS}
    mem_limit: ${OPEN_WEBUI_TERMINAL_MEM_LIMIT}

networks:
  default:
    name: open_webui_network
