# LiteLLM proxy — model routing for Open WebUI.
# Every `model_name` shows up in the Open WebUI model picker.
#
# Provider keys arrive as container env from the stack .env
# (see the `environment:` block of the open-webui-litellm service).

model_list:

  # --- Straight at the provider (no OpenRouter markup) ---
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-5
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: gpt-5
    litellm_params:
      model: openai/gpt-5
      api_key: os.environ/OPENAI_API_KEY

  # --- Via OpenRouter (everything without its own contract) ---
  - model_name: kimi-k2
    litellm_params:
      model: openrouter/moonshotai/kimi-k2
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Free tier, for trying things out ---
  # OpenRouter's ":free" variants cost nothing but are rate limited, and their
  # terms allow prompts to be used for training. Do not send anything from the
  # homelab you would not post publicly.
  - model_name: gpt-oss-20b-free
    litellm_params:
      model: openrouter/openai/gpt-oss-20b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: nemotron-ultra-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  # Passthrough so any OpenRouter id can be pinned without editing this file.
  # It does not show up in the model picker — add it under Workspace -> Models
  # with the exact id, e.g. openrouter/google/gemma-4-31b-it:free
  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: os.environ/OPENROUTER_API_KEY

  # --- Groq free tier ---
  # 30 RPM and up to 500k tokens/day at no cost. Tokens per minute are the
  # binding limit (1.2k-15k per model), so keep long contexts off these.
  - model_name: llama-3.3-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY

  # --- Cheap workhorse: chat titles, tags, autocomplete ---
  # Select it in Open WebUI under Admin Panel -> Interface as the task model,
  # otherwise the expensive main model generates every chat title.
  #
  # Two deployments under one name: the router spreads load across both and,
  # when one answers 429, drops it for cooldown_time seconds and uses the
  # other. Groq is free, the OpenRouter entry is the safety net.
  - model_name: task-model
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/GROQ_API_KEY

  - model_name: task-model
    litellm_params:
      model: openrouter/google/gemini-2.5-flash-lite
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  routing_strategy: simple-shuffle
  redis_host: open-webui-redis
  redis_port: 6379
  # Free tiers answer 429 rather than queueing. Take a failing deployment out
  # briefly instead of retrying into the same wall.
  allowed_fails: 1
  cooldown_time: 60
  num_retries: 2
  # If a provider goes down, the request degrades instead of erroring out.
  fallbacks:
    - claude-opus: ["gpt-5"]
    - gpt-5: ["claude-opus"]

litellm_settings:
  drop_params: true          # discard unknown params instead of erroring
  request_timeout: 600
  cache: true
  cache_params:
    type: redis
    host: open-webui-redis
    port: 6379
    ttl: 3600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
