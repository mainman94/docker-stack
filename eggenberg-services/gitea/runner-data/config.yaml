# act_runner config — loaded via CONFIG_FILE=/data/config.yaml
#
# act_runner spawns job containers on the HOST docker daemon (the runner
# mounts /var/run/docker.sock). Jobs join gitea_network so the "docker"
# alias resolves to the dind container, and build via dind over TLS.
#
# valid_volumes MUST allow the -v source below — act_runner strips any
# bind whose source isn't in this allow-list. The source is a HOST path
# (dind's /certs is bind-mounted from runner-certs on the host).
runner:
  # Concurrent jobs this runner will execute. Default 1 = serial. Matrix and
  # independent jobs parallelize up to this many (still gated by `needs:`).
  # Each concurrent job = one job container on the host + one build on dind,
  # so size dind/runner cpus+mem accordingly.
  capacity: 4

container:
  network: gitea_network
  valid_volumes:
    - /mnt/default_pool/dockge/stacks/Production/gitea/gitea/runner-certs/**
  options: -v /mnt/default_pool/dockge/stacks/Production/gitea/gitea/runner-certs/client:/certs/client -e DOCKER_HOST=tcp://docker:2376 -e DOCKER_TLS_VERIFY=1 -e DOCKER_CERT_PATH=/certs/client
