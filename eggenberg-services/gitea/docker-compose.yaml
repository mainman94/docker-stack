services:
  gitea-db:
    image: postgres:18.6-alpine3.24@sha256:432b3b824c0769275ec9b0947736ef8b376d6997bcaa9de29818f613819c2feb
    container_name: gitea-db
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=gitea
    environment:
      POSTGRES_DB: ${GITEA_POSTGRES_DATABASE}
      POSTGRES_USER: ${GITEA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${GITEA_POSTGRES_PASSWORD}
      TZ: ${GITEA_TZ}
    volumes:
      # PG18 stores its cluster in $PGDATA=/var/lib/postgresql/18/docker and
      # declares VOLUME /var/lib/postgresql. Mount the parent, as upstream
      # recommends: the cluster then lives in <postgres-data>/18/docker, where
      # it already is, and pg_upgrade --link works without crossing a mount
      # boundary. Do not pin PGDATA at /var/lib/postgresql/data — the mount
      # there is unused, and 18's entrypoint aborts on it.
      - ${GITEA_POSTGRES_DATA_HOST_PATH}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: ${GITEA_POSTGRES_CPUS}
    mem_limit: ${GITEA_POSTGRES_MEM_LIMIT}

  gitea:
    image: gitea/gitea:1.27.2
    container_name: gitea
    restart: unless-stopped
    depends_on:
      gitea-db:
        condition: service_healthy
    labels:
      - docker-volume-backup.stop-during-backup=gitea
    environment:
      USER_UID: ${GITEA_UID}
      USER_GID: ${GITEA_GID}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_POSTGRES_DATABASE}
      GITEA__database__USER: ${GITEA_POSTGRES_USER}
      GITEA__database__PASSWD: ${GITEA_POSTGRES_PASSWORD}
      GITEA__server__DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT}
      GITEA__server__SSH_LISTEN_PORT: 22
      GITEA__openid__ENABLE_OPENID_SIGNIN: ${GITEA_ENABLE_OPENID_SIGNIN}
      GITEA__openid__ENABLE_OPENID_SIGNUP: ${GITEA_ENABLE_OPENID_SIGNUP}
      GITEA__openid__WHITELISTED_URIS: ${GITEA_OPENID_WHITELISTED_URIS}
      GITEA__openid__BLACKLISTED_URIS: ${GITEA_OPENID_BLACKLISTED_URIS}
      GITEA__actions__ENABLED: ${GITEA_ACTIONS_ENABLED}
      # earl-grey theme — CSS must exist at
      # <data>/gitea/public/assets/css/theme-earl-grey.css
      GITEA__ui__DEFAULT_THEME: ${GITEA_DEFAULT_THEME}
      GITEA__ui__THEMES: ${GITEA_THEMES}
      TZ: ${GITEA_TZ}
    volumes:
      - ${GITEA_DATA_HOST_PATH}:${GITEA_DATA_CONTAINER_PATH}
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_WEB_PORT}:3000"
      - "${GITEA_SSH_PORT}:22"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${GITEA_CPUS}
    mem_limit: ${GITEA_MEM_LIMIT}

  gitea-runner-dind:
    image: docker:29.7.2-dind
    container_name: gitea-runner-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
      TZ: ${GITEA_TZ}
    volumes:
      - ${GITEA_RUNNER_CERTS_HOST_PATH}:/certs
    networks:
      default:
        aliases:
          - docker
    healthcheck:
      test: ["CMD-SHELL", "docker info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    cpus: ${GITEA_RUNNER_DIND_CPUS}
    mem_limit: ${GITEA_RUNNER_DIND_MEM_LIMIT}

  gitea-runner:
    image: gitea/act_runner:0.6.1
    container_name: gitea-runner
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
      gitea-runner-dind:
        condition: service_healthy
    labels:
      - docker-volume-backup.stop-during-backup=gitea
    environment:
      GITEA_INSTANCE_URL: ${GITEA_RUNNER_INSTANCE_URL}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME}
      GITEA_RUNNER_LABELS: ${GITEA_RUNNER_LABELS}
      # act_runner spawns job containers on the HOST docker (via the socket
      # below) so they can join gitea_network and reach dind via the "docker"
      # alias. Jobs themselves build on dind over TLS (see config.yaml).
      CONFIG_FILE: /data/config.yaml
      TZ: ${GITEA_TZ}
    volumes:
      - ${GITEA_RUNNER_DATA_HOST_PATH}:/data
      - ${GITEA_RUNNER_CERTS_HOST_PATH}:/certs
      - /var/run/docker.sock:/var/run/docker.sock
    cpus: ${GITEA_RUNNER_CPUS}
    mem_limit: ${GITEA_RUNNER_MEM_LIMIT}

networks:
  default:
    name: gitea_network
