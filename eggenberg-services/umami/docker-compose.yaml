services:
  umami-db:
    image: postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    container_name: umami-db
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=umami
    environment:
      POSTGRES_DB: ${UMAMI_POSTGRES_DATABASE}
      POSTGRES_USER: ${UMAMI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD}
      TZ: ${UMAMI_TZ}
    volumes:
      # PG18 stores its cluster in $PGDATA=/var/lib/postgresql/18/docker and
      # declares VOLUME /var/lib/postgresql. Mount the parent, as upstream
      # recommends: the cluster then lives in <postgres-data>/18/docker, where
      # it already is, and pg_upgrade --link works without crossing a mount
      # boundary. Do not pin PGDATA at /var/lib/postgresql/data — the mount
      # there is unused, and 18's entrypoint aborts on it.
      - ${UMAMI_POSTGRES_DATA_HOST_PATH}:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    cpus: ${UMAMI_POSTGRES_CPUS}
    mem_limit: ${UMAMI_POSTGRES_MEM_LIMIT}

  umami:
    image: ghcr.io/umami-software/umami:3.3
    container_name: umami
    init: true
    restart: unless-stopped
    user: "${UMAMI_UID}:${UMAMI_GID}"
    labels:
      - docker-volume-backup.stop-during-backup=umami
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${UMAMI_POSTGRES_USER}:${UMAMI_POSTGRES_PASSWORD}@umami-db:5432/${UMAMI_POSTGRES_DATABASE}
      APP_SECRET: ${UMAMI_APP_SECRET}
      DISABLE_TELEMETRY: ${UMAMI_DISABLE_TELEMETRY}
      TZ: ${UMAMI_TZ}
    ports:
      - "${UMAMI_WEB_PORT}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${UMAMI_CPUS}
    mem_limit: ${UMAMI_MEM_LIMIT}

networks:
  default:
    name: umami_network
