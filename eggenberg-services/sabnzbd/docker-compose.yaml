services:
  sabnzbd:
    image: linuxserver/sabnzbd:5.1.3-ls281@sha256:b356d0a9b22db584e9005364ec4e752dfc081ce501b7145e9a5c0bb38e4d1ba4
    container_name: sabnzbd
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=sabnzbd
    environment:
      PUID: ${SABNZBD_UID}
      PGID: ${SABNZBD_GID}
      TZ: ${SABNZBD_TZ}
    ports:
      - "${SABNZBD_WEB_PORT}:8080"
    volumes:
      - ${SABNZBD_CONFIG_HOST_PATH}:${SABNZBD_CONFIG_CONTAINER_PATH}
      - ${SABNZBD_DOWNLOADS_HOST_PATH}:${SABNZBD_DOWNLOADS_CONTAINER_PATH}
      # Completed downloads land inside the media datasets (Series, Movies), so
      # the Sonarr/Radarr import is a rename instead of a cross-dataset copy.
      # Only the .downloads folders are mounted, not the libraries, and they use
      # the same container paths as Sonarr/Radarr, so no remote path mapping.
      - ${SABNZBD_SERIES_COMPLETE_HOST_PATH}:${SABNZBD_SERIES_COMPLETE_CONTAINER_PATH}
      - ${SABNZBD_MOVIES_COMPLETE_HOST_PATH}:${SABNZBD_MOVIES_COMPLETE_CONTAINER_PATH}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${SABNZBD_CPUS}
    mem_limit: ${SABNZBD_MEM_LIMIT}

networks:
  default:
    name: sabnzbd_network
