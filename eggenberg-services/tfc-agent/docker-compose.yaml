services:
  tfc-agent:
    image: hashicorp/tfc-agent:1.33.0@sha256:30857052dd4e7b3f8ca5397fe52c2be8a4aa144723587e330f13c529b195719b
    container_name: tfc-agent
    restart: unless-stopped
    # ponytail: stateless outbound-only agent — no ports, no persistent data,
    # so no volume-backup wiring. Runs as the image's built-in tfc-agent user.
    environment:
      TZ: ${TFC_AGENT_TZ}
      TFC_ADDRESS: ${TFC_ADDRESS}
      TFC_AGENT_TOKEN: ${TFC_AGENT_TOKEN}
      TFC_AGENT_NAME: ${TFC_AGENT_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f tfc-agent >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${TFC_AGENT_CPUS}
    mem_limit: ${TFC_AGENT_MEM_LIMIT}

networks:
  default:
    name: tfc_agent_network
