# Recyclarr config — TRaSH Guides German quality profiles for Sonarr.
# Guide: https://trash-guides.info/Sonarr/sonarr-setup-quality-profiles-german-en/
# Docs:  https://recyclarr.dev/wiki/
# Base URL + API key come from the container environment (see .env.example).
#
# Behavior: primary target is German. English releases download first if they
# come out earlier, then upgrade to German once available (default — the
# `min_format_score` line below stays commented to keep English fallback).

sonarr:
  hd-bluray-web-ger:
    base_url: !env_var RECYCLARR_SONARR_BASE_URL
    api_key: !env_var RECYCLARR_SONARR_API_KEY

    include:
      - template: sonarr-quality-definition-series
      - template: sonarr-v4-quality-profile-hd-bluray-web-german

    quality_profiles:
      - name: HD Bluray + WEB (GER)
#        min_format_score: 10000 # Uncomment to skip English releases (German only)

      # Selective 720p profile — assign it to old/big series manually in Sonarr.
      # 720p-only, so files are naturally smaller (size caps are instance-global,
      # can't differ per profile). German scoring shared with the main profile.
      - name: HD-720p (GER)
        reset_unmatched_scores:
          enabled: true
        score_set: german
        upgrade:
          allowed: true
          until_quality: 720p
          until_score: 35000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: 720p
            qualities:
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p

    # German custom formats applied to BOTH profiles. Inlined (instead of the
    # CF template) so the 720p profile gets German preference too. Scores
    # auto-update from the guide via `score_set: german`; only the trash_id LIST
    # is pinned. If TRaSH adds German CFs, re-copy the list from config-templates
    # sonarr/includes/custom-formats/sonarr-v4-custom-formats-hd-bluray-web-german.yml
