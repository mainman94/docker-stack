# Recyclarr config — TRaSH Guides German quality profiles (Sonarr + Radarr).
# Written for recyclarr 8.7.0 native style: a `trash_id` quality profile +
# `custom_format_groups`. Sonarr and Radarr get the same three profiles:
# HD-1080p (GER), HD-720p (GER) and HD-720p (GER only) — see the Sonarr block.
#   Sonarr guide: https://trash-guides.info/Sonarr/sonarr-setup-quality-profiles-german-en/
#   Radarr guide: https://trash-guides.info/Radarr/radarr-setup-quality-profiles-german-en/
# Base URL + API key come from the container environment (see .env.example).
#
# NOTE: recyclarr 8.7.0 pins config-templates to a snapshot WITHOUT the older
# `include: - template:` templates. Do not reintroduce `include:` blocks unless
# a newer recyclarr release bumps the pinned templates commit.

sonarr:
  sonarr-ger:  # instance names must be unique across services
    base_url: !env_var RECYCLARR_SONARR_BASE_URL
    api_key: !env_var RECYCLARR_SONARR_API_KEY

    quality_definition:
      type: series

    # Three profiles, all on TRaSH's German scoring (German DL 11000 > German
    # 10000 > English-only ≤ ~3600):
    #   HD-1080p (GER)       1080p, German preferred, English fallback
    #   HD-720p (GER)        720p,  German preferred, English fallback
    #   HD-720p (GER only)   720p,  German mandatory, English track optional
    # "English fallback" = grab English if it is out first, upgrade to German.
    quality_profiles:
      # TRaSH [German] HD Bluray + WEB, narrowed to 1080p. Renamed via `name`;
      # recyclarr tracks the rename through its cache, Sonarr keeps assignments.
      - trash_id: dca7e5e9e99c703bcbdaaa471dd40e98  # [German] HD Bluray + WEB
        name: HD-1080p (GER)
        reset_unmatched_scores:
          enabled: true
        qualities:
          - name: Merged QPs
            qualities:
              - Bluray-1080p
              - WEBRip-1080p
              - WEBDL-1080p

      # 720p-only, so files are naturally smaller — for old/big series.
      - name: HD-720p (GER)
        reset_unmatched_scores:
          enabled: true
        score_set: german
        upgrade:
          allowed: true
          until_quality: 720p
          until_score: 35000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: 720p
            qualities:
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p

      # German mandatory, English as a second track (DL) is fine.
      # min_format_score 10000 = score of the `German` CF, so English-only
      # releases are never grabbed — TRaSH's own "German only" advice.
      - name: HD-720p (GER only)
        reset_unmatched_scores:
          enabled: true
        score_set: german
        upgrade:
          allowed: true
          until_quality: 720p
          until_score: 35000
        min_format_score: 10000
        quality_sort: top
        qualities:
          - name: 720p
            qualities:
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p

    # The trash_id profile gets these automatically; name-based profiles get
    # nothing unless assigned here (score_set alone only picks the scores).
    # Same CF list as TRaSH's [German] HD Bluray + WEB.
    custom_formats:
      - trash_ids:
          - 9aa0ca0d2d66b6f6ee51fc630f46cf6f  # German 1080p Booster
          - 290078c8b266272a5cc8e251b5e2eb0b  # 1080p
          - c99279ee27a154c2f20d1d505cc99e25  # 720p
          - 8a9fcdbb445f2add0505926df3bb7b8a  # German
          - ed51973a811f51985f14e2f6f290e47a  # German DL
          - c5dd0fd675f85487ad5bdf97159180bd  # German DL (undefined)
          - 133589380b89f8f8394320901529bac1  # Not German or English
          - 7940b2fb0278f27cf4f70187f2be95d6  # German Bluray Tier 01
          - 83b336a90d90d6b35ca673b007f80661  # German Bluray Tier 02
          - d8f8e1539827967e0e564833e6c08d33  # German Bluray Tier 03
          - 68be37323132b35cf333c81a2ac8fc16  # German Web Tier 01
          - f51b96a50b0e6196cb69724b7833d837  # German Web Tier 02
          - bda67c2c0aae257308a4723d92475b86  # German Web Tier 03
          - c2eec878fa1989599c226ce4c287d6a7  # German Scene
          - d6819cba26b1a6508138d25fb5e32293  # HD Bluray Tier 01
          - c2216b7b8aa545dc1ce8388c618f8d57  # HD Bluray Tier 02
          - e6258996055b9fbab7e9cb2f75819294  # WEB Tier 01
          - 58790d4e2fdcd9733aa7ae68ba2bb503  # WEB Tier 02
          - d84935abd3f8556dcd51d4f27e22d0a6  # WEB Tier 03
          - ec8fa7296b64e8cd390a1600981f3923  # Repack/Proper
          - eb3d5cc0a2be0db205fb823640db6a3c  # Repack2
          - 44e7c4de10ae50265753082e5dc76047  # Repack3
        assign_scores_to:
          - name: HD-720p (GER)
          - name: HD-720p (GER only)

    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
          # Explicit list overrides the guide-backed default, so name all three.
          assign_scores_to:
            - name: HD-1080p (GER)
            - name: HD-720p (GER)
            - name: HD-720p (GER only)
          select:
            - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
          # German profile isn't in this group's compatibility list, so target
          # both profiles explicitly or the negative scores are silently skipped.
          assign_scores_to:
            - name: HD-1080p (GER)
            - name: HD-720p (GER)
            - name: HD-720p (GER only)
          select:
            - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
            - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
            - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
            - 6f808933a71bd9666531610cb8c059cc  # BR-DISK (BTN)
            - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
            - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
            - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
            - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled

radarr:
  radarr-ger:
    base_url: !env_var RECYCLARR_RADARR_BASE_URL
    api_key: !env_var RECYCLARR_RADARR_API_KEY

    # Bandwidth cap: sizes are MB per MINUTE of runtime, not absolute GB.
    # 90 MB/min ≈ 10.3 GB for a 115 min movie (~11.7 GB at 130 min).
    quality_definition:
      type: movie
      qualities:
        - name: Bluray-1080p
          max: 90
          preferred: 85
        - name: WEBDL-1080p
          max: 90
          preferred: 85
        - name: WEBRip-1080p
          max: 90
          preferred: 85

    # Same three profiles as Sonarr — see the comment there.
    quality_profiles:
      - trash_id: 2b90e905c99490edc7c7a5787443748b  # [German] HD Bluray + WEB
        name: HD-1080p (GER)
        reset_unmatched_scores:
          enabled: true
        qualities:
          - name: Merged QPs
            qualities:
              - Bluray-1080p
              - WEBRip-1080p
              - WEBDL-1080p

      # 720p-only, so files are naturally smaller — for old/big movies.
      - name: HD-720p (GER)
        reset_unmatched_scores:
          enabled: true
        score_set: german
        upgrade:
          allowed: true
          until_quality: 720p
          until_score: 35000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: 720p
            qualities:
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p

      # German mandatory, English as a second track (DL) is fine.
      - name: HD-720p (GER only)
