# --- Radarr: TRaSH German quality profile ---------------------------------------
# Guide: https://trash-guides.info/Radarr/radarr-setup-quality-profiles-german-en/
# Same behavior as Sonarr: German primary, English fallback, upgrade to German.

radarr:
  hd-bluray-web-ger:
    base_url: !env_var RECYCLARR_RADARR_BASE_URL
    api_key: !env_var RECYCLARR_RADARR_API_KEY

    include:
      - template: radarr-quality-definition-movie
      - template: radarr-custom-formats-hd-bluray-web-german
      - template: radarr-quality-profile-hd-bluray-web-german

    # Bandwidth cap: sizes are MB per MINUTE of runtime, not absolute GB.
    # 90 MB/min ≈ 10.3 GB for a 115 min movie (~11.7 GB at 130 min).
    quality_definition:
      type: movie
      qualities:
        - name: Bluray-1080p
          max: 90
          preferred: 85
        - name: WEBDL-1080p
          max: 90
          preferred: 85
        - name: WEBRip-1080p
          max: 90
          preferred: 85

    quality_profiles:
      - name: HD Bluray + WEB (GER)
#        min_format_score: 10000 # Uncomment to skip English releases (German only)

    custom_formats:
### Optional — unwanted release groups/tags (uncomment to penalize)
      - trash_ids:
#          - b6832f586342ef70d9c128d40c07b872 # Bad Dual Groups
#          - ae9b7c9ebde1f3bd336a8cbd1ec4c5e5 # No-RlsGroup
#          - 7357cf5161efbf8c4d5d0c30b4815ee2 # Obfuscated
#          - 5c44f52a8714fdd79bb4d98e2673be1f # Retags
#          - f537cf427b64c38c8e36298f657e4828 # Scene
        assign_scores_to:
          - name: HD Bluray + WEB (GER)

### x265 — IMPORTANT: only use one of the two options below.
      - trash_ids:
#          - 839bea857ed2c0a8e084f3cbdbd65ecb # Allow HDR/DV x265 HD releases
        assign_scores_to:
          - name: HD Bluray + WEB (GER)

      - trash_ids:
#          - dc98083864ea246d05a42df0d05f81cc # Block all x265 HD releases
        assign_scores_to:
          - name: HD Bluray + WEB (GER)
            score: -35000
