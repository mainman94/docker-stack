# Recyclarr config — TRaSH Guides German quality profiles (Sonarr + Radarr).
# Written for recyclarr 8.7.0 native style: a `trash_id` quality profile +
# `custom_format_groups`. The `[German] HD Bluray + WEB` profile trash_id pulls
# the German custom formats and their scores automatically — German-primary,
# English downloads first if it releases earlier, then upgrades to German once
# available (default TRaSH behavior).
#   Sonarr guide: https://trash-guides.info/Sonarr/sonarr-setup-quality-profiles-german-en/
#   Radarr guide: https://trash-guides.info/Radarr/radarr-setup-quality-profiles-german-en/
# Base URL + API key come from the container environment (see .env.example).
#
# NOTE: recyclarr 8.7.0 pins config-templates to a snapshot WITHOUT the older
# `include: - template:` templates. Do not reintroduce `include:` blocks unless
# a newer recyclarr release bumps the pinned templates commit.

sonarr:
  hd-bluray-web-ger:
    base_url: !env_var RECYCLARR_SONARR_BASE_URL
    api_key: !env_var RECYCLARR_SONARR_API_KEY

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: dca7e5e9e99c703bcbdaaa471dd40e98  # [German] HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

      # Selective 720p profile — assign it to old/big series manually in Sonarr.
      # 720p-only, so files are naturally smaller. score_set: german shares the
      # German scoring. See caveat below re: CF score assignment.
      - name: HD-720p (GER)
        reset_unmatched_scores:
          enabled: true
        score_set: german
        upgrade:
          allowed: true
          until_quality: 720p
          until_score: 35000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: 720p
            qualities:
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p

    custom_format_groups:
      add:
        - trash_id: 158188097a58d7687dee647e04af0da3  # [Optional] Golden Rule HD
          select:
            - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
        - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
          select:
            - 15a05bc7c1a36e2b57fd628f8977e2fc  # AV1
            - 32b367365729d530ca1c124a0b180c64  # Bad Dual Groups
            - 85c61753df5da1fb2aab6f2a47426b09  # BR-DISK
            - 6f808933a71bd9666531610cb8c059cc  # BR-DISK (BTN)
            - fbcb31d8dabd2a319072b84fc0b7249c  # Extras
            - 9c11cd3f07101cdba90a2d81cf0e56b4  # LQ
            - e2315f990da2e2cbfc9fa5b7a6fcfe48  # LQ (Release Title)
            - 23297a736ca77c0fc8e70f8edd7ee56c  # Upscaled

radarr:
  hd-bluray-web-ger:
    base_url: !env_var RECYCLARR_RADARR_BASE_URL
    api_key: !env_var RECYCLARR_RADARR_API_KEY

    # Bandwidth cap: sizes are MB per MINUTE of runtime, not absolute GB.
    # 90 MB/min ≈ 10.3 GB for a 115 min movie (~11.7 GB at 130 min).
    quality_definition:
      type: movie
      qualities:
        - name: Bluray-1080p
          max: 90
          preferred: 85
        - name: WEBDL-1080p
          max: 90
          preferred: 85
        - name: WEBRip-1080p
          max: 90
          preferred: 85

    quality_profiles:
      - trash_id: 2b90e905c99490edc7c7a5787443748b  # [German] HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true

      # Selective 720p profile — assign it to old/big movies manually in Radarr.
      - name: HD-720p (GER)
        reset_unmatched_scores:
          enabled: true
        score_set: german
        upgrade:
          allowed: true
          until_quality: 720p
          until_score: 35000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: 720p
            qualities:
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p

    custom_format_groups:
      add:
        - trash_id: f8bf8eab4617f12dfdbd16303d8da245  # [Optional] Golden Rule HD
          select:
            - dc98083864ea246d05a42df0d05f81cc  # x265 (HD)
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
          select:
            - b8cd450cbfa689c0259a01d9e29ba3d6  # 3D
            - cae4ca30163749b891686f95532519bd  # AV1
            - b6832f586342ef70d9c128d40c07b872  # Bad Dual Groups
            - cc444569854e9de0b084ab2b8b1532b2  # Black and White Editions
            - ed38b889b31be83fda192888e2286d83  # BR-DISK
            - 0a3f082873eb454bde444150b70253cc  # Extras
            - e6886871085226c3da1830830146846c  # Generated Dynamic HDR
            - 90a6f9a284dff5103f6346090e6280c8  # LQ
            - e204b80c87be9497a8a6eaff48f72905  # LQ (Release Title)
            - 712d74cd88bceb883ee32f773656b1f5  # Sing-Along Versions
            - bfd8eb01832d646a0a89c4deb46f8564  # Upscaled
