services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2.9.0
    container_name: pocket-id
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=pocket-id
    environment:
      TZ: ${POCKET_ID_TZ}
      PUID: ${POCKET_ID_UID}
      PGID: ${POCKET_ID_GID}
      APP_URL: ${POCKET_ID_PUBLIC_APP_URL}
      TRUST_PROXY: ${POCKET_ID_TRUST_PROXY}
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY}
    volumes:
      - ${POCKET_ID_DATA_HOST_PATH}:/app/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${POCKET_ID_WEB_PORT}:1411"
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${POCKET_ID_CPUS}
    mem_limit: ${POCKET_ID_MEM_LIMIT}

networks:
  default:
    name: pocket-id_network
