services:
  # One-time init job: clones the exercise media dataset (~140 MB) into the
  # media bind mounts. Exits after first run; re-run is a no-op if img/ is populated.
  media:
    image: alpine/git:v2.54.0@sha256:4f9488b7295baec153a9953479690f835ad4699b1d9f11e3897a4485c224fc3e
    container_name: opengym_media
    user: "${OPENGYM_UID}:${OPENGYM_GID}"
    volumes:
      - ${OPENGYM_MEDIA_IMG_HOST_PATH}:/out/img
      - ${OPENGYM_MEDIA_GIF_HOST_PATH}:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        fi
        # nginx worker (unprivileged) must read/traverse the media dirs — copies land
        # as OPENGYM_UID with a umask that can exclude 'other'. Force it every run.
        chmod -R a+rX /out/img /out/gif
        if false; then
          :
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  api:
    # Release 1.2.13 — kept in lockstep with the web image below.
    image: registry.gitlab.com/duartesantos8/opengym/api:1.2.14@sha256:b9f85e02aa9630f1d4993ba3d0f19a92990b5f5e65e27a9c40437fd10f15cc01
    container_name: opengym_api
    labels:
      - docker-volume-backup.stop-during-backup=opengym
    user: "${OPENGYM_UID}:${OPENGYM_GID}"
    volumes:
      - ${OPENGYM_DATA_HOST_PATH}:/data
    environment:
      - TZ=${TZ:-Europe/Vienna}
      - PORT=3000
      - DATA_DIR=/data
      # Passkey (WebAuthn) binding — must match the public origin behind the gateway.
      - RP_ID=${OPENGYM_RP_ID}
      - ORIGIN=${OPENGYM_ORIGIN}
      - RP_NAME=${OPENGYM_RP_NAME:-openGym}
      # Registration gated behind invite codes; no open self-signup.
      - INVITE_ONLY=${OPENGYM_INVITE_ONLY:-1}
      # Comma-separated user IDs allowed to mint invites / admin.
      - ADMIN_UIDS=${OPENGYM_ADMIN_UIDS:-}
      # Disable the "Continue without account" guest button (separate from INVITE_ONLY).
      - ALLOW_GUEST=${OPENGYM_ALLOW_GUEST:-0}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${OPENGYM_API_CPUS}
    mem_limit: ${OPENGYM_API_MEM_LIMIT}
    restart: unless-stopped

  web:
    # Release 1.2.13 — kept in lockstep with the api image above.
    image: registry.gitlab.com/duartesantos8/opengym/web:1.2.14@sha256:db8e4982437ac180c2fb418989a6e314d670ec2c441aebb6fbaa9bc01898a2d5
    container_name: opengym_web
    # nginx binds :80 inside the container, so this one stays root (no user: directive).
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${OPENGYM_WEB_PORT}:80"
    volumes:
      - ${OPENGYM_MEDIA_IMG_HOST_PATH}:/usr/share/nginx/html/img:ro
      - ${OPENGYM_MEDIA_GIF_HOST_PATH}:/usr/share/nginx/html/gif:ro
    environment:
      - TZ=${TZ:-Europe/Vienna}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    cpus: ${OPENGYM_WEB_CPUS}
    mem_limit: ${OPENGYM_WEB_MEM_LIMIT}
    restart: unless-stopped

networks:
  default:
    name: opengym_network
