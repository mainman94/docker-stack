# MCP server exposing the super-intelligence knowledge vault over HTTP.
# Syncs the vault git repo into the data volume and serves it to MCP clients
# with bearer-token auth (see .env.example / secrets/tokens.yaml.example).
services:
  super-intelligence-mcp:
    image: ${SUPER_INTELLIGENCE_MCP_IMAGE:-ghcr.io/mainman94/super-intelligence-mcp:0.6.0@sha256:7b0f78d8bb423788c27e555c91a659fa429a0cea23711fb4f30f8929d5a54221}
    container_name: super-intelligence-mcp
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=super-intelligence-mcp
    env_file: .env
    environment:
      TZ: ${SUPER_INTELLIGENCE_MCP_TZ}
    ports:
      - "${SUPER_INTELLIGENCE_MCP_WEB_PORT}:8080"
    volumes:
      - ${SUPER_INTELLIGENCE_MCP_DATA_HOST_PATH}:/data
      - ${SUPER_INTELLIGENCE_MCP_SECRETS_HOST_PATH}:/secrets:ro
    healthcheck:
      # the image has no wget/curl; python is there. urlopen raises on the 503 /readyz returns
      # until the vault is cloned and indexed, so the exit code follows readiness.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # mirrors the hardening from the upstream repo's local-testing compose,
    # but runs as this repo's standard UID/GID (the image only hardcodes
    # 10001 as its own default; /data and /tmp are bind/tmpfs mounts, so any
    # UID works as long as the host dir is chowned to match)
    read_only: true
    tmpfs:
      - /tmp
    user: "568:568"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: ${SUPER_INTELLIGENCE_MCP_CPUS}
    mem_limit: ${SUPER_INTELLIGENCE_MCP_MEM_LIMIT}

networks:
  default:
    name: super_intelligence_mcp_network
