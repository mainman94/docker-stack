name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The compose-config hook shells out to `docker compose config`; the
      # runner already has a daemon, so nothing extra is needed here.
      - name: Run every hook
        uses: pre-commit/action@v3.0.1
