name: Image CVE sweep

# Advisory, not a gate: these are other people's images, and a new upstream
# CVE is not something a commit here can fix. The point is a weekly answer to
# "which of my services is currently exposed", in the run summary.
on:
  schedule:
    # Mondays, 06:17 UTC — off the hour so it does not queue behind everyone
    # else's cron.
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "**/docker-compose.yaml"
      - scripts/list-images.sh
      - scripts/scan-images.sh
      - mise.toml

permissions:
  contents: read

jobs:
  images:
    name: Scan every referenced image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # trivy and jq come from mise.toml, the same versions `make scan` uses
      # locally. This replaces piping Aqua's installer into `sudo sh`, which
      # ran whatever the script fetched at that moment.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4

      - name: Show trivy version
        run: trivy --version

      # Writes a per-image table to the job summary and always exits 0.
      - name: Sweep
        run: scripts/scan-images.sh
